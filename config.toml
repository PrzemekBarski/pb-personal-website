baseURL = 'https://przemyslawbarski.netlify.app'
defaultContentLanguage = 'en'
disableKinds = ['taxonomy', 'term']
enableInlineShortcodes = true

[languages]
  [languages.pl]
    weight = 2
    button = "Wersja polska"
  [languages.en]
    weight = 1
    button = "English Version"

[params]
  title_prefix = 'Przemysław Barski - '

[markup.goldmark.renderer]
  unsafe= true
