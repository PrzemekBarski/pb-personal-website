<div class="md:u-grid-col-start-5 xl:u-grid-rowspan-1 xl:u-grid-col-start-auto u-grid-colspan-12 md:u-grid-colspan-8 xl:u-grid-colspan-2 u-flex-col xs:u-flex-row u-flex xl:u-block c-link-overlay c-hover-lift c-hover-highlight c-hover-reveal u-shadow-solid-md" data-mobile-hover-target="element">

  <a href="{{ .RelPermalink }}" class="u-basis-6 u-bg-black u-block u-link-reset c-link-overlay__a">
    <div class="c-square">
      <div class="c-square__content u-text-center u-flex u-items-center u-content-center u-p-1.5">
        <div>
          <h2 class="u-text-xl u-text-display u-text-shadow">{{ .Title }}</h2>
          <button class="c-button u-absolute v--white v--lg lg:u-hidden v--no-transform c-hover-reveal__content">
            <span class="c-button__content">{{ i18n "explore" }}</span>
          </button>
        </div>
      </div>
    </div>
  </a>

  <div class="u-basis-6 c-square u-bg-red u-order-1 sm:u-order-0">
    <span class="c-square__content">
      {{ $images := .Resources.ByType "image" }}
      {{ $image := $images.GetMatch (printf "%s.*" .File.ContentBaseName) }}
      {{- with $image }}
        <img src="{{ .RelPermalink }}" alt="{{ $.Params.image_alt }}" width="285" height="285" class="u-w-full">
      {{- end }}
    </span>
    <div class="c-square__content c-hover-reveal__content">
      {{ $videos := (.Resources.ByType "video").Match (printf "%s.*" .File.ContentBaseName) }}

      {{- with $videos }}
      <video {{ with $image }}poster="{{ $image.RelPermalink }}" {{ end }}autoplay muted loop playsinline width="285" height="285" class="u-w-full">
        {{ range (sort $videos "MediaType.SubType" "desc") }}
          <source src="{{ .RelPermalink }}" type="{{ .MediaType }}">
        {{ end }}
      </video>
      {{- end }}
    </div>
  </div>

</div>
